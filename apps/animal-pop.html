<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Animal Pop · Pop Learning</title>
<link rel="stylesheet" href="../shared/pop.css" />
<style>
  .card .emoji { font-size:clamp(6rem, 30vw, 12rem); line-height: 1; }
  .label .word { text-transform:capitalize; font-size:clamp(2.5rem, 10vw, 4rem); font-weight:700; margin-top: 10px; }
  .nav { margin-top: 20px; }
</style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <a class="home" href="../index.html" aria-label="Back to all apps">🏠</a>
      <div class="titles">
        <h1>Animal&nbsp;<span>Pop</span></h1>
        <p>Tap the animal to hear its name</p>
      </div>
    </div>
    <div class="controls">
      <button class="ctrl" id="soundBtn" aria-pressed="true" aria-label="Toggle sound">🔊 Sound</button>
    </div>
  </header>

  <main class="stage">
    <button class="card pop" id="card" aria-label="Animal card. Tap to hear.">
      <span class="emoji" id="emoji">🐷</span>
      <div class="label">
        <span class="word" id="word">Pig</span>
      </div>
    </button>
    <div class="tap-hint">👆 tap the block to listen</div>

    <div class="nav">
      <button class="arrow" id="prevBtn" aria-label="Previous animal">←</button>
      <button class="say" id="sayBtn" aria-label="Say it">🔊 Say it</button>
      <button class="arrow" id="nextBtn" aria-label="Next animal">→</button>
    </div>
  </main>

  <footer class="bottom">
    <div class="counter" id="counter">1 / 10</div>
    <div class="progress"><i id="bar"></i></div>
  </footer>

<script src="../shared/pop.js"></script>
<script src="../shared/data.js"></script>
<script>
(function(){
  "use strict";
  var $ = Pop.$;
  var ANIMALS = Pop.data.animals;
  var pos = 0;
  
  var card = $("card"), emoji = $("emoji"), word = $("word");
  var bar = $("bar"), counter = $("counter");

  function current() { return ANIMALS[pos]; }

  function render(animate){
    var A = current();
    emoji.textContent = A[1];
    word.textContent = A[0];
    
    var pct = Math.round(((pos + 1) / ANIMALS.length) * 100);
    bar.style.width = pct + "%";
    counter.textContent = (pos + 1) + " / " + ANIMALS.length;
    
    var col = Pop.color(pos);
    card.style.setProperty("--c", col[0]);
    card.style.setProperty("--c-dark", col[1]);
    
    if(animate){ card.classList.remove("pop"); void card.offsetWidth; card.classList.add("pop"); }
  }

  function sayCurrent(){ var A = current(); Pop.speak(A[0]); }
  function go(dir){ pos = (pos + dir + ANIMALS.length) % ANIMALS.length; render(true); }

  card.addEventListener("click", function(){
    card.classList.remove("pop"); void card.offsetWidth; card.classList.add("pop");
    Pop.sparkle(card); sayCurrent();
  });
  $("prevBtn").addEventListener("click", function(){ go(-1); });
  $("nextBtn").addEventListener("click", function(){ go(1); });
  $("sayBtn").addEventListener("click", function(){ Pop.sparkle(card); sayCurrent(); });

  var soundBtn = $("soundBtn");
  soundBtn.setAttribute("aria-pressed", String(Pop.getSound()));
  soundBtn.innerHTML = Pop.getSound() ? "🔊 Sound" : "🔇 Sound";
  soundBtn.addEventListener("click", function(){
    var on = !Pop.getSound(); Pop.setSound(on);
    this.setAttribute("aria-pressed", String(on));
    this.innerHTML = on ? "🔊 Sound" : "🔇 Sound";
  });

  Pop.onArrows(function(){go(-1);}, function(){go(1);}, function(){ Pop.sparkle(card); sayCurrent(); });
  render(false);
})();
</script>
</body>
</html>
