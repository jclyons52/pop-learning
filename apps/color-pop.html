<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Color Splat · Pop Learning</title>
<link rel="stylesheet" href="../shared/pop.css" />
<style>
  .card { border-radius: 50%; aspect-ratio: 1; padding: 0; box-shadow: 0 12px 0 rgba(0,0,0,0.15); border: 8px solid white; }
  .card:active { box-shadow: 0 0 0 rgba(0,0,0,0); transform: translateY(12px) scale(0.96); }
  .label { margin-top: 20px; text-align: center; }
  .label .word { text-transform:capitalize; font-size:clamp(3rem, 12vw, 5rem); font-weight:700; color: var(--ink); }
  .nav { margin-top: 30px; }
</style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <a class="home" href="../index.html" aria-label="Back to all apps">🏠</a>
      <div class="titles">
        <h1>Color&nbsp;<span>Splat</span></h1>
        <p>Tap the splat to hear the color</p>
      </div>
    </div>
    <div class="controls">
      <button class="ctrl" id="soundBtn" aria-pressed="true" aria-label="Toggle sound">🔊 Sound</button>
    </div>
  </header>

  <main class="stage">
    <div style="display:flex; flex-direction:column; align-items:center;">
      <button class="card pop" id="card" aria-label="Color splat. Tap to hear.">
      </button>
      <div class="label">
        <span class="word" id="word">Red</span>
      </div>
    </div>
    <div class="tap-hint">👆 tap the splat to listen</div>

    <div class="nav">
      <button class="arrow" id="prevBtn" aria-label="Previous color">←</button>
      <button class="say" id="sayBtn" aria-label="Say it">🔊 Say it</button>
      <button class="arrow" id="nextBtn" aria-label="Next color">→</button>
    </div>
  </main>

  <footer class="bottom">
    <div class="counter" id="counter">1 / 10</div>
    <div class="progress"><i id="bar"></i></div>
  </footer>

<script src="../shared/pop.js"></script>
<script src="../shared/data.js"></script>
<script>
(function(){
  "use strict";
  var $ = Pop.$;
  var COLORS = Pop.data.colors;
  var pos = 0;
  
  var card = $("card"), word = $("word");
  var bar = $("bar"), counter = $("counter");

  function current() { return COLORS[pos]; }

  function render(animate){
    var C = current();
    word.textContent = C[0];
    
    var pct = Math.round(((pos + 1) / COLORS.length) * 100);
    bar.style.width = pct + "%";
    counter.textContent = (pos + 1) + " / " + COLORS.length;
    
    // Use the actual hex color
    card.style.background = C[1];
    
    if(animate){ card.classList.remove("pop"); void card.offsetWidth; card.classList.add("pop"); }
  }

  function sayCurrent(){ var C = current(); Pop.speak(C[0]); }
  function go(dir){ pos = (pos + dir + COLORS.length) % COLORS.length; render(true); }

  card.addEventListener("click", function(){
    card.classList.remove("pop"); void card.offsetWidth; card.classList.add("pop");
    Pop.sparkle(card); sayCurrent();
  });
  $("prevBtn").addEventListener("click", function(){ go(-1); });
  $("nextBtn").addEventListener("click", function(){ go(1); });
  $("sayBtn").addEventListener("click", function(){ Pop.sparkle(card); sayCurrent(); });

  var soundBtn = $("soundBtn");
  soundBtn.setAttribute("aria-pressed", String(Pop.getSound()));
  soundBtn.innerHTML = Pop.getSound() ? "🔊 Sound" : "🔇 Sound";
  soundBtn.addEventListener("click", function(){
    var on = !Pop.getSound(); Pop.setSound(on);
    this.setAttribute("aria-pressed", String(on));
    this.innerHTML = on ? "🔊 Sound" : "🔇 Sound";
  });

  Pop.onArrows(function(){go(-1);}, function(){go(1);}, function(){ Pop.sparkle(card); sayCurrent(); });
  render(false);
})();
</script>
</body>
</html>
